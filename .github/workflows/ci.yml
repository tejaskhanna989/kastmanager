name: Build Kast Manager

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtk-4-dev \
            libadwaita-1-dev libgtop2-dev librsvg2-dev \
            desktop-file-utils libfuse2

      - name: Configure
        run: meson setup build --prefix=/usr --buildtype=release

      - name: Build
        run: ninja -C build

      - name: Test (unit)
        run: meson test -C build --print-errorlogs || true

  appimage:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtk-4-dev \
            libadwaita-1-dev libgtop2-dev librsvg2-dev \
            desktop-file-utils libfuse2 curl file zsync

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: KastManager-x86_64.AppImage
          path: KastManager-x86_64.AppImage

  snap:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: snapcraft

      - uses: actions/upload-artifact@v4
        with:
          name: kastmanager-snap
          path: ${{ steps.snapcraft.outputs.snap }}


  deb:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper meson ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtop2-dev

      - name: Build binary package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p deb-out && mv ../kast-manager_*.deb deb-out/ && ls deb-out/

      - name: Test install
        run: |
          sudo apt-get install -y ./deb-out/kast-manager_*.deb
          /usr/bin/kast-manager --help 2>&1 | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: kast-manager-deb
          path: deb-out/

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y git rpm-build rpmdevtools meson ninja-build gcc \
            pkg-config gtk4-devel libadwaita-devel libgtop2-devel \
            desktop-file-utils libappstream-glib

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/kast-manager.spec ~/rpmbuild/SPECS/
          VER=$(grep -oP '^Version:\s+\K[0-9.]+' packaging/fedora/kast-manager.spec)
          rm -rf /tmp/kastsrc && mkdir -p /tmp/kastsrc/kastmanager-$VER
          cp -a . /tmp/kastsrc/kastmanager-$VER/
          rm -rf /tmp/kastsrc/kastmanager-$VER/.git
          tar -czf ~/rpmbuild/SOURCES/v$VER.tar.gz -C /tmp/kastsrc kastmanager-$VER
          rpmbuild -bb ~/rpmbuild/SPECS/kast-manager.spec
          mkdir -p "$GITHUB_WORKSPACE/rpm-out"
          cp ~/rpmbuild/RPMS/*/kast-manager-[0-9]*.rpm "$GITHUB_WORKSPACE/rpm-out/" && ls "$GITHUB_WORKSPACE/rpm-out/"

      - uses: actions/upload-artifact@v4
        with:
          name: kast-manager-rpm
          path: rpm-out/

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -x
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sSL --retry 3 --retry-all-errors \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/cmdtools.zip
          ls -lh /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          export PATH=$SDK/cmdline-tools/latest/bin:$PATH
          which sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kast-manager-apk
          path: android/app/build/outputs/apk/debug/*.apk
