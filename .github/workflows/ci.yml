name: Build Kast Manager

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtk-4-dev \
            libadwaita-1-dev libgtop2-dev librsvg2-dev \
            desktop-file-utils libfuse2

      - name: Configure
        run: meson setup build --prefix=/usr --buildtype=release

      - name: Build
        run: ninja -C build

      - name: Test (unit)
        run: meson test -C build --print-errorlogs || true

  appimage:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtk-4-dev \
            libadwaita-1-dev libgtop2-dev librsvg2-dev \
            desktop-file-utils libfuse2 curl file zsync

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: KastManager-x86_64.AppImage
          path: KastManager-x86_64.AppImage

  snap:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: snapcraft

      - uses: actions/upload-artifact@v4
        with:
          name: kastmanager-snap
          path: ${{ steps.snapcraft.outputs.snap }}


  deb:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper meson ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtop2-dev

      - name: Build binary package
        run: dpkg-buildpackage -b -us -uc

      - name: Test install
        run: |
          sudo apt-get install -y ../kast-manager_*.deb
          kast-manager --help 2>&1 | head -n 3 || true
          /usr/bin/kast-manager --version 2>&1 | head -n 2 || true

      - uses: actions/upload-artifact@v4
        with:
          name: kast-manager-deb
          path: ../kast-manager_*.deb
